# This workflow will install Python dependencies, run tests and lint with a single version of Python
name: ETH Discussions Collection

on:
  release:
    types: [published]
  push:
    tags:
    - 'v*'
  schedule:
    - cron: '25 0/3 * * *'
  watch:
    types: [started]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    # 1. 拉取代码仓库 (仅需深度 1，极速拉取)
    - name: Checkout Code Repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 1

    # 2. 拉取数据仓库到一个子目录 (名为 data-repo)
    - name: Checkout Data Repository
      uses: actions/checkout@v4
      with:
        repository: Benjamin-Fairy/ETH_Discussion_Collection  # ⚠️ 请修改为你的用户名和刚才新建的数据仓库名
        token: ${{ secrets.DATA_REPO_TOKEN }}
        path: data-repo  # 将数据仓库拉取到这个子文件夹中

    # 3. 将生成的数据移动到数据仓库目录，并执行推送
    - name: Copy History Data
      run: |
        # 创建目标文件夹（如果不存在的话）
        mkdir -p data-repo/data data-repo/dataid data dataid
        
        # 将新生成的数据拷贝到数据仓库的目录中
        cp -r data-repo/data/* data/ || true
        cp -r data-repo/dataid/* dataid/ || true

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
        cache: 'pip' 

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
        
    - name: Run ETH.py
      env:
        header_secret: ${{ secrets.HEADERS }}
      run: |
        # 脚本运行后，新的数据会生成在当前目录的 data/ 和 dataid/ 中
        python ETH.py

    # 3. 将生成的数据移动到数据仓库目录，并执行推送
    - name: Move Data and Push to Data Store
      run: |
        # 将新生成的数据拷贝到数据仓库的目录中
        cp -r data/* data-repo/data/ || true
        cp -r dataid/* data-repo/dataid/ || true
        
        # 进入数据仓库目录
        cd data-repo
        
        # 配置 Git 机器人信息
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        
        # 添加并提交数据
        git add data/ dataid/
        
        # 检查是否有文件变动，如果有则 commit 并 push
        if ! git diff --staged --quiet; then
          git commit -m "Auto-update ETH market data"
          git push
        else
          echo "No new data to commit."
        fi
